<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --cream: #f8f5ef;
    --paper: #efe7dc;
    --ink: #33241a;
    --muted: #7b6857;
    --brown: #8a5a2b;
  }
  html, body { margin: 0; padding: 0; }
  body { overflow: hidden; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  .canvas {
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 50%, #fffdf9 0%, var(--cream) 38%, var(--paper) 100%);
  }
  .glow {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(196,150,100,.28) 0%, rgba(196,150,100,0) 70%);
  }
  .phone {
    position: absolute; box-sizing: border-box;
    background: #1d1511; padding: 1.6%;
    border-radius: 9% / 4.2%;
    box-shadow: 0 40px 90px rgba(60,35,20,.28), 0 8px 24px rgba(60,35,20,.18);
  }
  .phone img { display: block; width: 100%; height: 100%; border-radius: 7.6% / 3.5%; }
  .center { position: absolute; display: flex; align-items: center; justify-content: center; }
  .owl { display: block; filter: drop-shadow(0 18px 30px rgba(80,45,20,.22)); }
  .title { color: var(--ink); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .sub { color: var(--muted); font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
  .rule { background: var(--brown); border-radius: 99px; opacity: .85; }
  .guide { position: absolute; outline: 6px dashed #e0245e; pointer-events: none; }
</style>
</head>
<body>
<!-- App Store creative assets (docs/app-store/creative/). Render at Apple's sizes:
     Chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files
       --window-size=3840,1646 --screenshot=header.png "file://…/creative.html?layout=header"
       --window-size=3840,2560 --screenshot=search.png "file://…/creative.html?layout=search"
     Add &guides=1 to outline Apple's art safe area. The PNGs must have no alpha channel. -->
<script>
  const q = new URLSearchParams(location.search);
  const layout = q.get("layout") || "header";
  const guides = q.get("guides") === "1";
    const owl = "../../../../src/lib/assets/rupert-owl.png";
  const L = {
    // Apple's sizes and art safe areas (creative assets specifications).
    header: { w: 3840, h: 1646, safe: [1097, 493, 1646, 661] },
    search: { w: 3840, h: 2560, safe: [836, 765, 2168, 1030] },
  }[layout];

  const c = document.createElement("div");
  c.className = "canvas";
  c.style.width = L.w + "px"; c.style.height = L.h + "px";
  document.body.appendChild(c);
  const add = (cls, css, html = "") => {
    const e = document.createElement("div"); e.className = cls;
    Object.assign(e.style, css); e.innerHTML = html; c.appendChild(e); return e;
  };
  const phone = (file, x, y, h, rot, z) => {
    const w = Math.round(h * 1320 / 2868 * 1.035);
    add("phone", { left: x + "px", top: y + "px", width: w + "px", height: h + "px",
      transform: `rotate(${rot}deg)`, zIndex: z }, `<img src="${shotsAbs}${file}">`);
    return w;
  };
  const shotsAbs = "../screenshots/large/";
  const [sx, sy, sw, sh] = L.safe;

  if (layout === "header") {
    add("glow", { left: (L.w / 2 - 1100) + "px", top: (L.h / 2 - 700) + "px", width: "2200px", height: "1400px" });
    const ph = 1360, top = (L.h - ph) / 2 + 40;
    phone("1-folder.png", 50, top - 40, ph, -7, 1);
    phone("2-search.png", 400, top + 30, ph, 3, 2);
    phone("3-document.png", L.w - 400 - 640, top + 30, ph, -3, 2);
    phone("4-scan.png", L.w - 50 - 640, top - 40, ph, 7, 1);
    add("center", { left: sx + "px", top: sy + "px", width: sw + "px", height: sh + "px", gap: "70px" }, `
      <img class="owl" src="${owl}" style="height:560px">
      <div>
        <div class="title" style="font-size:118px">Rupert</div>
        <div class="rule" style="width:150px;height:12px;margin:34px 0 34px"></div>
        <div class="sub" style="font-size:64px;color:var(--ink);font-weight:600">Your scanned<br>documents, found.</div>
      </div>`);
  } else {
    add("glow", { left: (L.w / 2 - 1300) + "px", top: (L.h / 2 - 1100) + "px", width: "2600px", height: "2200px" });
    const ph = 1720, top = (L.h - ph) / 2;
    phone("2-search.png", 20, top, ph, 4, 2);
    phone("3-document.png", L.w - 20 - 819, top, ph, -4, 2);
    add("center", { left: sx + "px", top: sy + "px", width: sw + "px", height: sh + "px",
      flexDirection: "column", gap: "0" }, `
      <img class="owl" src="${owl}" style="height:560px">
      <div class="title" style="font-size:132px;margin-top:46px">Your scanned documents, found.</div>
      <div class="sub" style="font-size:66px;margin-top:30px">Search, scan and file, right where your files live.</div>`);
  }
  if (guides) add("guide", { left: sx + "px", top: sy + "px", width: sw + "px", height: sh + "px", zIndex: 9 });
</script>
</body>
</html>
