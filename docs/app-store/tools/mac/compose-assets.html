<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<script>
  // ?kind=bg | mask | caption&text=…   (window: 1664 × 936 at 128,120 on 1920 × 1080)
  const q = new URLSearchParams(location.search);
  const kind = q.get("kind");
  const X = 128, Y = 120, W = 1664, H = 936, R = 16;
  const el = (css, html = "") => { const d = document.createElement("div"); d.style.cssText = css; d.innerHTML = html; document.body.appendChild(d); return d; };
  if (kind === "bg") {
    el(`position:absolute;inset:0;width:1920px;height:1080px;background:
        radial-gradient(ellipse at 50% 45%, #fffdf9 0%, #f8f5ef 45%, #ece2d4 100%);`);
    el(`position:absolute;left:${X}px;top:${Y}px;width:${W}px;height:${H}px;border-radius:${R}px;background:#f8f5ef;
        box-shadow:0 30px 70px rgba(60,35,20,.28), 0 6px 18px rgba(60,35,20,.16), 0 0 0 1px rgba(60,35,20,.10);`);
  } else if (kind === "mask") {
    // White inside the rounded window shape, black outside (used as alpha).
    el(`position:absolute;inset:0;width:${W}px;height:${H}px;background:#000;`);
    el(`position:absolute;left:0;top:0;width:${W}px;height:${H}px;border-radius:${R}px;background:#fff;`);
  } else {
    el(`position:absolute;left:0;top:0;width:1920px;height:${Y}px;display:flex;align-items:center;justify-content:center;
        color:#33241a;font-weight:650;font-size:46px;letter-spacing:-0.015em;`, q.get("text"));
  }
</script>
</body>
</html>
