[workspace]
members = ["src-tauri", "crates/rupert-core", "mobile", "mobile/plugin"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Micki Braun"]
license = "MIT"
repository = "https://github.com/micki-b/Rupert"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind" # the indexer isolates per-file panics (malformed PDFs) with catch_unwind
strip = true
