name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run. On main every commit
# runs to the end (its own group, by commit), so each one gets a real result
# instead of "cancelled".
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info in CI builds: much smaller target folders (the runners'
  # disks are small), and nothing here needs a debugger.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Whether anything but documentation changed. A pull request (or push)
  # that only touches Markdown, docs/ or site/ (built and uploaded by hand,
  # not here) skips the jobs below; GitHub counts a skipped job as passing
  # for the required "check". If this job fails, they all run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No base to compare with (a manual run, a new branch): run everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -vE '\.md$|^docs/|^site/' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: the checks and builds are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast checks on Linux only.
  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux'
        # The hosted Linux runners ship toolkits Rupert doesn't use; the
        # workspace's debug builds need the room.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Android app (mobile/) still compiles and passes clippy. Only the Rust
  # side: the Gradle build and signing happen in scripts/build-android.sh.
  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The runner's preinstalled NDK compiles the C parts (SQLite).
      - name: NDK compiler
        shell: bash
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: npm ci
      # The app embeds the built pages.
      - run: npm run build
      - run: cargo clippy -p rupert-mobile --target aarch64-linux-android -- -D warnings

  # Unsigned app bundles for each desktop platform.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest     # Apple silicon
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: windows-latest
            args: ""
            target: ""
          - platform: ubuntu-24.04
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux'
        # The hosted Linux runners ship toolkits Rupert doesn't use; the
        # workspace's debug builds need the room.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
        env:
          # The repo also holds the phone app (mobile/); build the desktop one.
          TAURI_APP_PATH: src-tauri
      - uses: actions/upload-artifact@v7
        with:
          name: rupert-${{ runner.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
