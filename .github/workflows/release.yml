# Builds signed installers for macOS (universal), Windows and Linux when a
# version tag is pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`),
# and puts them on a draft GitHub release together with `latest.json` for
# the updater. Review the draft, then publish it: the updater only sees
# published releases.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions). Without them the
# matching step is skipped and that installer is unsigned:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   update signing (required)
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: …")          macOS signing
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (key file contents)  notarization
#   AZURE_CLIENT_ID, AZURE_TENANT_ID                                Windows signing (no password:
#                                                                   GitHub's OIDC token, see docs/RELEASING.md)
# Variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
# The build jobs run in the `release` environment: Azure trusts exactly that.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # The oldest supported Ubuntu, so the AppImage runs on more systems.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read
      id-token: write # Windows signing signs in to Azure with GitHub's token
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        # The hosted Linux runners ship toolkits Rupert doesn't use; the
        # workspace's debug builds need the room.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh
        env:
          PDFIUM_TARGET: ${{ runner.os == 'macOS' && 'universal' || '' }}
      # SignTool with Microsoft's Artifact Signing plug-in; scripts/windows-sign.ps1
      # uses them for every file `tauri build` signs, and here for PDFium.
      - name: Windows signing setup
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $pkg = Join-Path $dir 'dlib.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.151' -OutFile $pkg
          Expand-Archive $pkg -DestinationPath (Join-Path $dir 'dlib')
          $dlib = Join-Path $dir 'dlib/bin/x64/Azure.CodeSigning.Dlib.dll'
          if (!(Test-Path $dlib)) { throw "No signing plug-in at $dlib" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$signtool) { throw 'Windows SDK SignTool not found' }
          Write-Output "SignTool: $($signtool.FullName)"
          # Only the GitHub token (workload identity): no other sign-in is tried.
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = '${{ vars.AZURE_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.AZURE_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ vars.AZURE_SIGNING_PROFILE }}'
            ExcludeCredentials = @('EnvironmentCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzureCliCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          "RUPERT_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "RUPERT_SIGN_DLIB=$dlib" >> $env:GITHUB_ENV
          "RUPERT_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          $env:RUPERT_SIGNTOOL = $signtool.FullName
          $env:RUPERT_SIGN_DLIB = $dlib
          $env:RUPERT_SIGN_METADATA = $metadata
          ./scripts/windows-sign.ps1 src-tauri/pdfium/pdfium.dll
      - name: Notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Release configuration
        shell: bash
        run: python3 scripts/release-config.py
      - run: npm ci
      - name: Build
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }} --config target/release.conf.json
        env:
          # The repo also holds the phone app (mobile/); build the desktop one.
          TAURI_APP_PATH: src-tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Tauri notarizes the app; the disk image around it needs its own
      # ticket too, or macOS warns when it's opened.
      - name: Notarize the disk image
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          done
      # With signing set up, an unsigned installer is a failed release.
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path target/release/bundle -Include *-setup.exe, *.msi
          $files += Get-ChildItem -Path target/release -Filter rupert.exe
          $files += Get-Item src-tauri/pdfium/pdfium.dll
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz*
            target/**/release/bundle/msi/*.msi*
            target/**/release/bundle/nsis/*-setup.exe*
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage*
          if-no-files-found: error

  # One draft release with every installer, the update bundles and latest.json.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and write latest.json
        run: python3 scripts/release-manifest.py artifacts "${{ github.ref_name }}" dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --draft \
            --title "Rupert ${{ github.ref_name }}" \
            --notes "Installers for macOS (Apple silicon and Intel), Windows and Linux are below. See CHANGELOG.md for what's new."
