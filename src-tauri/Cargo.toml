[package]
name = "rupert"
description = "Rupert, the librarian: scanned-document management on top of your own folders"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "rupert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capitalized so the Dock and menu bar say "Rupert" when it runs straight from
# the source tree (`tauri dev` has no app bundle, so macOS shows the file
# name). Built bundles keep a lowercase executable: `mainBinaryName` in
# tauri.conf.json.
name = "Rupert"
path = "src/main.rs"

[features]
# The Mac App Store edition (sandboxed; tauri.appstore.conf.json): no
# self-updater (the App Store updates it) and no `ant` command sign-in
# (a sandboxed app can't run other programs).
app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rupert-core = { path = "../crates/rupert-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
# API keys for cloud assistant providers, in the system keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
drag = "2.1.1"

# Dragging out (#84): which window is under the pointer when a drag ends.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSSharingService", "NSView", "NSSavePanel", "NSPanel"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Mapi", "Win32_System_LibraryLoader"] }
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_WinRT"] }
windows-collections = "0.3"
