[package]
name = "rupert-core"
description = "Rupert's document library engine: sources, indexing, metadata. No UI or Tauri dependency."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lopdf = "0.47.0"
notify-debouncer-mini = "0.7.0"
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
