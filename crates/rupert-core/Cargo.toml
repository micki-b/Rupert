[package]
name = "rupert-core"
description = "Rupert's document library engine: sources, indexing, metadata. No UI or Tauri dependency."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
png = "0.18.1"
# rustls: the assistant's cloud models are HTTPS (Local AI and scanners stay plain HTTP).
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
flate2 = "1.1.11"
lopdf = "0.47.0"
notify-debouncer-mini = "0.7.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] } # schemas keep their field order (llm.rs)
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }
sys-locale = "0.3.2"
jpeg-encoder = "0.7.1"
qrcodegen = "1.8"
unicode-normalization = "0.1.26"
# Export as a zip (#107); PDFs go stored, lists deflated. Desktop only (the
# `export` feature): zip 9.7 doesn't build for 32-bit Android (armv7).
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2"], optional = true }

[features]
# OneDrive through Microsoft Graph (the phone app).
onedrive = []
# Google Drive through the Drive API (the phone app).
gdrive = []
# Export… as a zip or a folder (#107, the desktop app).
export = ["dep:zip"]

[dev-dependencies]
tempfile = "3.27.0"

# Moving files to the Trash / Recycle Bin (desktop only; the phone never deletes).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "coinit_apartmentthreaded"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSFileManager", "NSURL", "NSError", "NSString", "NSRange", "NSValue"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
